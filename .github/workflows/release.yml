name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Trusted publishing (OIDC): no NPM_TOKEN anywhere. The npm-side trusted
# publisher must point at this repo + this workflow filename (release.yml).
# Note: npm requires the package to already exist before OIDC can publish it,
# so the very first 0.1.0 publish is manual; everything after flows through here.
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          # No registry-url: OIDC needs neither it nor NODE_AUTH_TOKEN.

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm test

      - name: Create release PR or publish to npm
        uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          # RELEASE_TOKEN, not GITHUB_TOKEN: GitHub suppresses workflow runs on
          # branches pushed by GITHUB_TOKEN, so `verify` never runs on the release
          # PR and its required check can never go green. Falls back until the
          # secret exists; without it, merging the release PR needs admin bypass.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
