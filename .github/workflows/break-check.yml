name: API Check

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  break-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: clerk/break-check@92be9cc726c848b9567c7b869e9b11dc761ddd6e # v1 = v0.6.0
        with:
          break-check-version: '0.6.0'
          fail-on-breaking: true
