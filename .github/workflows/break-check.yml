name: API Check

on:
  # labeled/unlabeled are not in the default activity set, and without them
  # applying the acknowledgement label would leave the check red until the next
  # push. One click has to be enough.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  break-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # An intentional break lands by applying the `breaking-change` label, which
      # turns this check green. Nothing to commit and nothing to prune later, and
      # the label is the record of who decided. Red therefore means "a break
      # nobody has acknowledged" rather than "this PR touched the API", which is
      # the only reading that survives being a required check.
      - uses: clerk/break-check@92be9cc726c848b9567c7b869e9b11dc761ddd6e # v1 = v0.6.0
        with:
          break-check-version: '0.6.0'
          fail-on-breaking: ${{ !contains(github.event.pull_request.labels.*.name, 'breaking-change') }}
          # Read break-check.config.json from the base ref, so a PR cannot clear
          # its own break by editing the config it is judged against: adding to
          # acknowledgedChanges, widening ignoreSubpaths or resolvableSpecifiers,
          # or dropping the package. That was a footnote while this check was
          # advisory and is a way around a required gate now. The label is meant
          # to be the only acknowledgement, and it leaves a record of who applied
          # it; a config entry merges quietly and keeps suppressing that symbol
          # until someone prunes it.
          policy-mode: true
